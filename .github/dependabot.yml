version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-va-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Hoãn CÓ CHỦ ĐÍCH (chốt 26/09/2026) — không phải quên cập nhật:
      # typescript major 7: chờ tới khi có compiler API phù hợp cho tooling nội bộ, ghim ^6.0.3.
      # prisma + @prisma/client: ĐÃ lên major 7 (driver adapter pg, đo lại pg_locks 01/10/2026). Vẫn chặn
      # PR semver-major tự động (8.x) — nâng major Prisma đổi cách nối DB/sinh client, phải đi PR tay có
      # đo lại khoá test + review đối kháng. Gỡ ignore của gói nào khi quyết định của gói đó đổi.
      # `ignore`/`update-types` CHỈ chặn version update thường — theo tài liệu GitHub, PR vá BẢO MẬT
      # (kể cả khi bản vá đó nằm ở major mới) KHÔNG bị chặn, Dependabot vẫn tự mở như bình thường.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/adapter-pg"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-va-patch:
        update-types: ["minor", "patch"]
