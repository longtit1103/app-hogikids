name: CI

# 4 job gác chất lượng mỗi PR vào main (KHÔNG chạy lại khi push main — xem `on:` dưới):
#   typecheck  — cổng allowlist snapshot public (chạy TRƯỚC npm ci) + tsc --noEmit (không cần DB)
#   unit       — Vitest (Postgres tạm: tạo schema app + migrate deploy trước, rồi vitest)
#   e2e        — Playwright (Postgres tạm + browser; global-setup tự migrate + seed user)
#   docker     — dựng ảnh y như lúc deploy (không push ảnh); ba job trên đều MÙ với lỗi chỉ vỡ trong ảnh
# CI KHÔNG bao giờ đụng DB minipc/prod — mỗi job dựng Postgres tạm riêng, xong vứt.
# TZ ép Asia/Ho_Chi_Minh (bất biến #3): assert P&L neo theo ngày giờ VN, runner UTC sẽ lệch.
# Node 24: harness e2e nạp .ts động (global-setup import src/lib/password) → cần Node có
# native TypeScript (máy dev chạy Node 25). Node 20 không nạp được .ts → e2e chết ở seed.

# CHỈ pull_request (+ workflow_dispatch để bấm tay), KHÔNG push main — bỏ 18/09. Đo 30 lượt CI
# gần nhất của repo private, tính Σ thời lượng 4 job (= phút Actions bị trừ): 17/30 là lượt push
# main, ≈13 phút/lượt, tổng 220 phút — lặp lại gần y nguyên PR đã xanh vì merge là squash. Gói
# Free chỉ có 2.000 phút/tháng (08/2026 đốt 2.624). Cái mất: main KHÔNG được test lại nếu hai PR
# đan xen (PR sau xanh trên base cũ) — 1 người dev, PR nối tiếp nên chấp nhận; nghi ngờ thì bấm
# "Run workflow" (workflow_dispatch) trên main, hoặc publish --ref để CI free ở public. Push THẲNG
# code lên main = không CI (đo 60 commit gần nhất: 14 commit không qua PR, TẤT CẢ là docs) — luật
# CLAUDE.md đã cấm push thẳng main; giữ luật đó là điều kiện để cổng này có nghĩa.
# Bản public (app-hogikids, Actions miễn phí) được script publish CHÈN thêm trigger push cho
# main + nhánh CI tạm ci/** — để `--watch` vẫn tìm thấy run. Đừng thêm push: vào đây.
# paths-ignore: PR CHỈ đụng docs/, plans/, deploy/*.md (đúng vùng exclude của bản public) thì
# KHÔNG chạy CI — 14/30 commit main gần nhất chỉ sửa tài liệu. Cố ý KHÔNG chặn `*.md` toàn cây:
# file .md mới ở gốc repo vẫn phải qua cổng allowlist (job typecheck).
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'plans/**', 'deploy/*.md']
  workflow_dispatch:

# Mặc định GITHUB_TOKEN chỉ đọc — cả 4 job đều không ghi gì lên repo (không comment PR, không
# push tag, không tạo release). Job nào cần quyền ghi sau này thì khai riêng `permissions:` ở
# đúng job đó, không nới ở mức workflow.
permissions:
  contents: read

# Đẩy commit mới lên PR đang chạy CI ⇒ HUỶ lượt cũ: 4 job × ~13' trên HEAD đã bị thay không còn
# giá trị. Group theo ref (refs/pull/<n>/merge) nên hai PR khác nhau không huỷ nhau.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    env:
      # Chỉ cần biến TỒN TẠI cho prisma generate / tsc — KHÔNG kết nối thật.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=app
    steps:
      - uses: actions/checkout@v7
      # Cổng allowlist của bản snapshot công khai: file nguồn mới nào chưa được phân loại
      # (allowlist hoặc luật exclude) thì lượt publish sẽ ABORT — nhưng cổng đó chỉ nổ lúc có
      # NGƯỜI chạy publish, tức muộn hơn hẳn lúc file được thêm vào (ca thật 20/08: lộ ra sau
      # khi PR đã mở và đã nghiệm thu xong). Đây là đúng phép phân loại ấy, gọi chung một hàm.
      # Bám vào job có sẵn thay vì đẻ job thứ 5 (tiết kiệm runner), và đặt TRƯỚC npm ci vì nó
      # chỉ cần git — không deps, không mạng, không token, không ghi gì vào worktree. Hỏng ở đây
      # thì dừng luôn, khỏi tốn phút cài phụ thuộc.
      - name: Cổng allowlist snapshot public (chỉ kiểm, không publish)
        # ĐÚNG FILE ci.yml NÀY chạy ở CẢ HAI repo — repo gốc và bản snapshot công khai — mà bản
        # snapshot thì CỐ Ý không mang script publish lẫn allowlist (chúng tự loại khỏi bản public).
        # Nên phải phân biệt tường minh, đừng để "không thấy file" thành lỗi câm:
        #   có cả hai      ⇒ repo gốc            ⇒ chạy cổng
        #   thiếu cả hai   ⇒ đúng bản snapshot   ⇒ bỏ qua, in rõ lý do
        #   thiếu một      ⇒ không nhất quán     ⇒ ĐỎ, không đoán bừa
        run: |
          S=scripts/publish-public-snapshot.sh
          A=scripts/public-snapshot-allowlist.txt
          if [ -f "$S" ] && [ -f "$A" ]; then
            bash "$S" --chi-kiem-allowlist
          elif [ ! -f "$S" ] && [ ! -f "$A" ]; then
            echo "▸ Bỏ qua: đây là bản snapshot công khai (script + allowlist cố ý không có mặt)."
          else
            echo "✗ Chỉ thiếu MỘT trong hai ($S / $A) — trạng thái không nhất quán." >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hogikids_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d hogikids_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: Asia/Ho_Chi_Minh
      # DATABASE_URL PHẢI khác TEST_DATABASE_URL (guard tests/setup.ts chống xoá nhầm DB thật).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres?schema=app
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/hogikids_test?schema=app
      # DB dùng một lần cho test migration/rollback/restore (DROP/CREATE schema tự do) — KHÔNG
      # bao giờ trùng TEST_DATABASE_URL.
      TEST_DATABASE_URL_MIGRATION: postgresql://ci:ci@localhost:5432/hogikids_migration_test?schema=app
      SESSION_SECRET: ci-session-secret-not-for-prod-min-32-characters
      INGEST_SECRET: ci-ingest-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Tạo schema app trong DB test
        # Prisma 7 bỏ cờ `--url` của `db execute` — URL đi qua `prisma.config.ts` (đọc DATABASE_URL).
        run: echo 'CREATE SCHEMA IF NOT EXISTS app;' | npx prisma db execute --stdin
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/hogikids_test?schema=app
      - name: Tạo DB migration dùng một lần + schema app
        # CREATE DATABASE không chạy được trong transaction ⇒ dùng psql (runner ubuntu có sẵn client).
        run: |
          psql "postgresql://ci:ci@localhost:5432/hogikids_test" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE hogikids_migration_test;'
          psql "postgresql://ci:ci@localhost:5432/hogikids_migration_test" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS app;'
      - name: Migrate deploy vào DB test
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/hogikids_test?schema=app
      - run: npm test

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hogikids_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d hogikids_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: Asia/Ho_Chi_Minh
      # global-setup.ts tự migrate + seed; chỉ cần DATABASE_URL khác TEST (guard) + schema app tồn tại.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres?schema=app
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/hogikids_test?schema=app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Tạo schema app trong DB test
        # Prisma 7 bỏ cờ `--url` của `db execute` — URL đi qua `prisma.config.ts` (đọc DATABASE_URL).
        run: echo 'CREATE SCHEMA IF NOT EXISTS app;' | npx prisma db execute --stdin
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/hogikids_test?schema=app
      - name: Migrate + seed reference data (Channel/Category/Setting) vào DB test
        run: |
          npx prisma migrate deploy
          npx prisma db seed
        env:
          # seed.ts tạo 4 Channel + 7 Category + 2 Setting (Order.channelId FK cần Channel)
          # rồi 1 user. global-setup.ts sau đó xoá user + tạo user test riêng — Channel giữ nguyên.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/hogikids_test?schema=app
          INIT_EMAIL: ci-seed@hogikids.test
          INIT_PASSWORD: ci-seed-password
      - name: Cài Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Lưu report khi lỗi
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Dựng ảnh Docker
    runs-on: ubuntu-latest
    # Trần thời gian: một bước treo im lặng đã từng đốt 106 phút hạn mức Actions mà không ai biết
    # cho tới lúc mở log từng bước. Lượt NGUỘI đo thật trên runner: 1m19s (npm ci 21,4s ·
    # prisma generate + next build 22,7s) ⇒ quá 25 phút là treo, không phải chậm.
    timeout-minutes: 25
    # Postgres tạm cho bước chạy Prisma 7 TRONG ảnh đã prune với DB thật (migrate deploy/status + truy vấn
    # qua adapter-pg). Cùng khuôn service của job unit/e2e; container ảnh nối qua `--network host`.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hogikids_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d hogikids_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # VÌ SAO CÓ JOB NÀY: ba job trên đều chạy trên repo ĐÃ CHECKOUT ĐỦ nên mù với trọn lớp lỗi
      # chỉ vỡ BÊN TRONG ảnh — thứ tự COPY sai, file thiếu trong build context, .dockerignore loại
      # nhầm, kho apt/PGDG đổi. Ca thật 19/08: `npm ci` chết ENOENT vì tarball vendor
      # (package.json trỏ xlsx vào file:./third-party/...) chưa được chép trước, trong khi CI xanh
      # 3/3 suốt hơn một ngày — lỗi chỉ lộ đúng lúc bấm deploy, lúc prod đã tụt lại 1 commit.
      # Từ #261 ảnh bị prune devDependencies nên "dựng được" KHÔNG còn đủ: ba bước sau build CHẠY ảnh để
      # chứng minh ảnh đã prune vẫn đủ công cụ vận hành, chạy được Prisma 7 với Postgres thật (service tạm
      # ở trên) và khởi động được — job e2e chạy `npm run dev` trên cây đầy đủ nên mù với lớp lỗi này. Tốn
      # thêm ~20–40 s/PR (chủ shop duyệt 30/09) + vài chục giây cho migrate trên DB trống.
      - name: Dựng ảnh (không push)
        # Tag mang SHA, KHÔNG BAO GIỜ `latest`: trên máy thật `latest` là ảnh đang chạy, dựng đè lên
        # là mất bản ghi để lùi (đã xảy ra 19/08 — cả `docker tag` lẫn `docker commit` đều không cứu
        # lại được). Runner ubuntu-latest cùng kiến trúc amd64 với minipc nên đây là phép thử thật.
        # --progress=plain: log đầy đủ từng bước, đọc được ngay dòng chết mà không phải mở lại ảnh.
        run: |
          docker build --progress=plain -t hogikids-app:ci-${{ github.sha }} .
          docker image inspect -f 'Kích thước ảnh: {{.Size}} byte' hogikids-app:ci-${{ github.sha }}
      - name: Ảnh đủ công cụ vận hành, không còn devDependencies
        # Luôn `npx --no-install`: thiếu gói thì bước này ĐỎ — KHÔNG BAO GIỜ để npx tự tải từ npm (đo
        # 30/09: `npx prisma` thiếu gói đòi tải prisma@8.0.0-rc.19). prisma/tsx là thứ runbook/DR chạy
        # trong container; tsx nạp ĐÚNG hai module bước ③b dùng, qua alias `@/` như script thật.
        # Prisma 7: không còn query engine nhị phân — client là mã TS sinh vào `src/generated/prisma` (generate
        # trong Dockerfile, TRƯỚC prune), CLI đọc `prisma.config.ts`; tsx nạp nhà máy client (kéo client sinh +
        # @prisma/adapter-pg + pg) như seed/rebuild-from-raw, không mở kết nối. Schema engine (migrate) vẫn nhị phân.
        run: |
          docker run --rm --entrypoint sh hogikids-app:ci-${{ github.sha }} -c '
            set -e
            npx --no-install prisma --version
            npx --no-install tsx --version
            for p in vitest jsdom shadcn vite @testing-library/react; do
              if [ -e "node_modules/$p" ]; then echo "✗ ảnh còn devDependency $p"; exit 1; fi
            done
            test -e src/generated/prisma/client.ts
            test -e prisma.config.ts
            test -x node_modules/@prisma/engines/schema-engine-debian-openssl-3.0.x
            npx --no-install tsx -e "import(\"@/lib/tao-prisma-client\").then((m) => { if (typeof m.taoPrismaClient !== \"function\") process.exit(1); console.log(\"tsx nạp client Prisma OK\"); })"
            npx --no-install tsx -e "Promise.all([import(\"@/lib/backup/run-pg-dump\"), import(\"@/lib/backup/assert-plain-sql-only-schema\")]).then(([a, b]) => { if (typeof a.pgDumpArgsFromUrl !== \"function\" || typeof b.assertPlainSqlOnlySchema !== \"function\") process.exit(1); console.log(\"tsx nạp module ③b OK\"); })"
          '
      - name: Ảnh đã prune chạy Prisma 7 với Postgres thật
        # Bước trên chỉ NẠP module, không mở kết nối — lệnh vận hành đầu tiên chạy Prisma 7 trong ảnh prune với
        # DB thật sẽ là lúc deploy PROD (`docker compose run --rm app npx --no-install prisma migrate deploy|status`).
        # Ở đây chạy đúng các lệnh đó trên DB trống: CLI đọc `prisma.config.ts` (prisma/config) + schema engine
        # nhị phân, rồi tsx dựng client qua `taoPrismaClient` (client sinh + adapter-pg + pg) và truy vấn thật —
        # bảng `_prisma_migrations` không ghi schema ⇒ đọc được là `?schema=app` đã thành search_path.
        # Schema `app` tạo trước bằng psql của runner, như job unit (prod: schema đã có sẵn).
        run: |
          psql "postgresql://ci:ci@localhost:5432/hogikids_ci" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS app;'
          docker run --rm --network host \
            -e DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/hogikids_ci?schema=app' \
            --entrypoint sh hogikids-app:ci-${{ github.sha }} -c '
            set -e
            npx --no-install prisma migrate deploy
            npx --no-install prisma migrate status
            npx --no-install tsx -e "import(\"@/lib/tao-prisma-client\").then(async (m) => { const p = m.taoPrismaClient(process.env.DATABASE_URL); const r = await p.\$queryRawUnsafe(\"SELECT 1 AS ok, count(*)::int AS n FROM _prisma_migrations\"); await p.\$disconnect(); if (r[0].ok !== 1 || !(r[0].n > 0)) process.exit(1); console.log(\"client Prisma 7 trong ảnh truy vấn DB OK:\", r[0].n, \"migration\"); })"
          '
      - name: Ảnh khởi động bằng CMD mặc định và dừng sạch
        # CMD mặc định (không override) ⇒ kiểm luôn CMD không qua npx. /dang-nhap là route healthcheck
        # của compose, không chạm DB ⇒ DATABASE_URL trỏ cổng chết là đủ. Dừng phải thoát 143 (Next nhận
        # SIGTERM); qua vỏ `npx` thì thoát 1 kèm `npm error signal SIGTERM` (đo amd64 30/09).
        run: |
          docker run -d --name ci-app \
            -e SESSION_SECRET=ci-khong-phai-secret-that-0123456789abcdef0123456789 \
            -e INGEST_SECRET=ci-khong-phai-secret \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci \
            hogikids-app:ci-${{ github.sha }}
          ok=0
          for i in $(seq 1 60); do
            if docker exec ci-app curl -fsS -o /dev/null http://127.0.0.1:3000/dang-nhap; then ok=1; break; fi
            sleep 1
          done
          docker stop -t 15 ci-app >/dev/null
          code=$(docker inspect -f '{{.State.ExitCode}}' ci-app)
          docker logs ci-app 2>&1 | tail -20
          [ "$ok" = 1 ] || { echo "✗ /dang-nhap không lên trong 60 s"; exit 1; }
          [ "$code" = 143 ] || { echo "✗ dừng thoát $code, mong 143"; exit 1; }
