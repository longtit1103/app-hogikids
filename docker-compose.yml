services:
  app:
    container_name: hogikids-app
    build: .
    image: hogikids-app
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh           # giờ VN cho new Date()/date-fns (đồng bộ ENV TZ trong Dockerfile — B1)
    ports:
      - "127.0.0.1:3000:3000"        # chỉ localhost — reverse proxy/tunnel (host) + debug; KHÔNG phơi ra LAN
    volumes:
      - ./backups:/backups           # pre-restore dump BỀN qua rebuild + thư mục backups của container đọc được (C3)
      - ./uploads:/app/public/uploads # logo shop BỀN qua rebuild, KHÔNG lưu DB (C6)
    restart: unless-stopped
    # KHÔNG scale service này ra nhiều replica: khoá đăng nhập sai + hàng đợi đăng nhập
    # (src/lib/login-lockout.ts, src/lib/login-gate.ts) giữ state bằng `Map` trong RAM của
    # đúng 1 tiến trình — nhiều replica thì mỗi bản sao có bộ đếm riêng, kẻ tấn công chia đều
    # request qua các replica là vòng qua khoá hoàn toàn.
    healthcheck:
      # Ảnh KHÔNG gỡ `curl` khỏi stage runtime (Dockerfile cài ở stage base cho bước lấy khoá
      # GPG PGDG, giữ nguyên tới runner) nên dùng thẳng, không cần cõng thêm `node -e fetch(...)`.
      # /dang-nhap trả 200 không cần đăng nhập — đúng route health-check không đụng DB/session.
      # docker compose KHÔNG tự restart container unhealthy (không có mục `depends_on.condition:
      # service_healthy` nào dùng nó) — healthcheck chỉ để NHÌN THẤY trạng thái (`docker ps`) và
      # làm cổng smoke sau khi deploy, không phải cơ chế tự phục hồi.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/dang-nhap"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Trần RAM 3g: minipc chạy CHUNG với Postgres + n8n nên app không được ăn hết RAM máy.
    # Bước ngốn RAM nhất là KIỂM NỘI DUNG file phục hồi: đo 22/09/2026, `assertPlainSqlOnlySchema`
    # dùng RAM gấp ~43 lần kích thước SQL phẳng (nó giữ 4-5 bản soi phái sinh cùng lúc). Vì thế
    # trần bung nén của đường .sql.gz đã hạ xuống 24 MiB (MAX_UNZIPPED_BYTES, xem bảng số đo trong
    # src/lib/backup/run-restore.ts) ⇒ đỉnh dự kiến ~1 GiB, cộng RAM nền Next.js vẫn nằm gọn trong
    # 3g. Lưu ý lịch sử: comment cũ ở đây viện dẫn con số 2GiB của hằng đó làm cơ sở cho 3g — con
    # số ấy là TRẦN GIẢ (tiến trình chết từ ~45 MiB), nên lập luận cũ sai; giữ 3g vì lý do mới.
    mem_limit: 3g
    networks: [supabase_default]   # supabase-db VÀ hogikids-n8n ĐỀU ở supabase_default (đã verify) → app gọi cả hai bằng tên; chỉ cần 1 mạng
# depends_on KHÔNG bắt buộc: supabase-db + hogikids-n8n thuộc stack Supabase/n8n; app chỉ attach external network supabase_default.
# XÁC MINH tên mạng thật trước khi up (phòng project-name khác):
#   docker inspect supabase-db hogikids-n8n --format '{{json .NetworkSettings.Networks}}'
# — máy này = supabase_default (n8n ở CẢ supabase_default + hogikids_hogikids-net). Đổi tên bên dưới nếu khác.
networks:
  supabase_default: { external: true }
